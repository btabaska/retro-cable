      - { weekday: wednesday, start: "16:00", block: fox-kids }
      - { weekday: wednesday, start: "20:00", primetime: true, pool: [{ show: the-simpsons, weight: 3 }, { show: the-x-files, weight: 2 }, { show: beverly-hills-90210, weight: 2 }, { show: king-of-the-hill }, { show: "24" }] }
