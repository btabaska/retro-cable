      - { weekday: thursday, start: "20:00", primetime: true, pool: [{ show: the-simpsons, weight: 3 }] }
      - { weekday: thursday, start: "23:00", pool: [{ show: the-simpsons }, { show: that-70s-show }, { show: malcolm-in-the-middle }] }
