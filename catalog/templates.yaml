# yaml-language-server: $schema=schema/templates.schema.json
# Day-part templates per channel, with era versions (Claude drafted; Brandon edits).
# A template covers a channel from `from` until `until` (open when omitted); a day picks the
# covering template. Parts name a weekday and the local HH:MM they begin; a program already
# running finishes before the next part starts, so parts anchor the day. Every weekday that
# appears needs a 00:00 part. A part's pool picks among shows or carriage tags by weight;
# `block` restricts to shows carried in that channel block, and an empty pool with a block
# means "everything the block carries". primetime parts air NEW episodes the day they debut.
# A channel — or a single weekday — with no covering template gets the default: one all-day
# part playing everything the channel carries (block shows excluded) at carriage weights.
# Only ktvu, cartoon-network and adult-swim are drafted so far; the rest run on the default.

templates:
  # KTVU 2 (Fox): Fox Kids after school and Saturday morning, network primetime at 8.
  - id: ktvu-foxkids-era
    channel: ktvu
    from: 1990-01-01
    until: 2002-08-31
    parts:
      - { weekday: monday, start: "00:00", pool: [{ show: cops, weight: 2 }, { show: americas-most-wanted }] }
      - { weekday: monday, start: "16:00", block: fox-kids }
      - { weekday: monday, start: "20:00", primetime: true, pool: [{ show: the-simpsons, weight: 3 }, { show: the-x-files, weight: 2 }, { show: beverly-hills-90210, weight: 2 }, { show: king-of-the-hill }, { show: "24" }] }
