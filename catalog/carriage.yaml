# approximate years from memory (Jan 1 of the first year to Dec 31 of the last), clamped to the
# channel's launch. Episode eligibility still comes from Plex/TMDB air dates and overrides.yaml,
# so a loose window only decides which channel can air a show, not which episodes.
# `show` is the stable id; `title` is matched against Plex (overrides.yaml can set plex_title).
# Prune freely.

