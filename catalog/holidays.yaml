# yaml-language-server: $schema=schema/holidays.schema.json
# Holiday calendar. Rules: fixed (month/day) or nth_weekday (n, weekday, month).
# window_days: days before the holiday (inclusive of the day) when tagged items are favored.
# mode per channel: on | specials_only | off. Default applies when a channel isn't listed.
#   on             tagged episodes are preferred, and holiday movies and specials air in prime
#   specials_only  holiday movies and specials air in prime; episodes are not preferred
#   off            nothing is injected
# The season of a holiday is its window or its month up to the day, whichever is longer.
# Holiday movies, and tagged episodes of `seasonal` shows in overrides.yaml (the Peanuts
# specials), air only in season on every channel, library movie channels included. On the
# holiday itself, a movie channel (mode not off) runs a marathon of its movies tagged for
# that holiday, back to back all broadcast day. Titles are tagged by keyword (server catalog/holidays.py);
# `tagged` adds titles the keywords miss, and overrides.yaml holiday_tags fixes episodes.

holidays:
  - id: halloween
    name: Halloween
    rule: { type: fixed, month: 10, day: 31 }
    window_days: 7
    strength: strong
    default_mode: "on"
    tagged:
      - { title: "Under Wraps", kind: movie, channel: disney, premiere: 1997 }
      - { title: "Halloweentown", kind: movie, channel: disney, premiere: 1998 }
      - { title: "Halloweentown II: Kalabar's Revenge", kind: movie, channel: disney, premiere: 2001 }
      - { title: "Twitches", kind: movie, channel: disney, premiere: 2005 }

  - id: thanksgiving
    name: Thanksgiving
    rule: { type: nth_weekday, n: 4, weekday: thursday, month: 11 }
    window_days: 3
    strength: medium
    default_mode: "on"

  - id: christmas
    name: Christmas
    rule: { type: fixed, month: 12, day: 25 }
    window_days: 25
    strength: strong
    default_mode: "on"
    tagged:
      - { title: "Rudolph the Red-Nosed Reindeer", kind: special, channel: kpix }
      - { title: "Frosty the Snowman", kind: special, channel: kpix }

  - id: new-years-eve
    name: New Year's Eve
    rule: { type: fixed, month: 12, day: 31 }
    window_days: 1
    strength: medium
    default_mode: specials_only

  - id: valentines
    name: Valentine's Day
    rule: { type: fixed, month: 2, day: 14 }
    window_days: 2
    strength: medium
    default_mode: "on"

  - id: st-patricks
    name: St. Patrick's Day
    rule: { type: fixed, month: 3, day: 17 }
    window_days: 3
    strength: medium
    default_mode: specials_only
    channels:
      disney: "on"
      disney-movies: "on"
    tagged:
      - { title: "The Luck of the Irish", kind: movie, channel: disney, premiere: 2001 }

  - id: independence-day
    name: Independence Day
    rule: { type: fixed, month: 7, day: 4 }
    window_days: 2
    strength: low
    default_mode: specials_only
