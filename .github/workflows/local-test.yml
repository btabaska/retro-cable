# Full local stack on Brandon's Mac. Hermes reads the result and the uploaded artifacts.
name: local-test

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

# One stack at a time: it binds 127.0.0.1:8080 on the Mac.
concurrency:
  group: local-test
  cancel-in-progress: false

jobs:
  local-test:
    # Same-repo PRs only: the self-hosted runner must never run code from a fork.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'local-test') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, retro-cable]
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          cd server && uv sync --frozen && cd ..
          cd web && npm ci && npx playwright install chromium webkit
      - name: Start the test stack (compose.test.yml, fixtures)
        run: make stack-up
      - name: Playwright (Chromium + WebKit) against the stack
        run: make e2e-stack
      - name: Collect stack logs
        if: always()
        run: |
          mkdir -p web/test-results
          docker compose -f ops/compose.yml -f ops/compose.test.yml logs --no-color > web/test-results/stack.log 2>&1 || true
      - name: No signed media URLs in the logs
        if: always()
        run: |
          if grep -n 'sig=' web/test-results/stack.log > /dev/null; then
            echo "stack.log contains signed media URLs (sig=); never log them" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: local-test-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
      - name: Stop the stack
        if: always()
        run: make stack-down
