name: server

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: server-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install ffmpeg (fixture generator tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: cd server && uv sync --frozen
      - name: Lint (ruff, mypy --strict)
        run: make lint-server
      - name: Test (server, OpenAPI drift, fixtures, ops scripts)
        run: make test-server test-tools test-ops
