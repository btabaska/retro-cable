# On merge to main: release-please keeps a release PR open; merging it tags a version.
# Every push builds multi-arch images (sha-<short>, edge); a release also tags <version> and latest.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  images:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: server
            file: server/Dockerfile
            target: api
          # The api image plus ffmpeg, for the jobs-profile worker.
          - name: worker
            context: server
            file: server/Dockerfile
            target: worker
          - name: web
            context: .
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        env:
          RELEASED: ${{ needs.release-please.outputs.release_created }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          image=ghcr.io/btabaska/retro-cable-${{ matrix.name }}
          tags="$image:sha-${GITHUB_SHA::7},$image:edge"
          if [[ $RELEASED == "true" ]]; then
            tags="$tags,$image:$VERSION,$image:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: RC_GIT_SHA=${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
