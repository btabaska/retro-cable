# XcodeGen spec for the Apple TV app. `make tvos` generates RetroCable.xcodeproj (gitignored) and
# builds it for the tvOS Simulator without signing. Never hand-edit the generated project.
name: RetroCable
options:
  bundleIdPrefix: us.tabaska
  deploymentTarget:
    tvOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Left empty: Brandon picks his Personal Team in Xcode (Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "3"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  RetroCableKit:
    path: RetroCableKit
targets:
  RetroCable:
    type: application
    platform: tvOS
    sources:
      - path: RetroCable
    dependencies:
      - package: RetroCableKit
    info:
      path: RetroCable/Info.plist
      properties:
        CFBundleDisplayName: Retro Cable
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The cable box server. Tests override it with -RCServerURL or RC_SERVER_URL.
        RCServerURL: https://tv.home.tabaska.us
        UIAppFonts:
          - Arimo-Regular.ttf
          - Arimo-Bold.ttf
          - Arimo-Italic.ttf
          - ArchivoNarrow-Regular.ttf
          - ArchivoNarrow-Bold.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities:
          - arm64
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.tabaska.retrocable
        PRODUCT_NAME: RetroCable
        GENERATE_INFOPLIST_FILE: NO
  RetroCableTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: RetroCableTests
    dependencies:
      - target: RetroCable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.tabaska.retrocable.tests
        GENERATE_INFOPLIST_FILE: YES
  RetroCableUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: RetroCableUITests
    dependencies:
      - target: RetroCable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.tabaska.retrocable.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RetroCable:
    build:
      targets:
        RetroCable: all
    test:
      targets:
        - RetroCableTests
        - RetroCableUITests
      gatherCoverageData: false
