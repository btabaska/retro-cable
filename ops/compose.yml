# Production stack. Deployed by ops/deploy.sh, which sets RC_VERSION.
# The host Caddy (ops/caddy/retro-cable.caddy) proxies tv.home.tabaska.us to the web port.
# Paths come from ops/.env (see ops/.env.example). Only the worker writes the media root.
name: retro-cable

services:
  api:
    image: ghcr.io/btabaska/retro-cable-api:${RC_VERSION:-edge}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      RC_DATA_DIR: /data
      RC_CATALOG_DIR: /catalog
      RC_MEDIA_DIR: /media
    volumes:
      - ${RC_DATA_DIR:-./data}:/data
      - ${RC_CATALOG_SRC:-../catalog}:/catalog:ro
      - ${RC_MEDIA_DIR:-./media}:/media:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Static browser app plus a reverse proxy: /api/* -> api, /media/* -> media files once the
  # api has checked the signature (web/Caddyfile).
  web:
    image: ghcr.io/btabaska/retro-cable-web:${RC_VERSION:-edge}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${RC_WEB_BIND:-127.0.0.1}:${RC_WEB_PORT:-8080}:80"
    volumes:
      - ${RC_MEDIA_DIR:-./media}:/srv/media:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Ingest jobs, run on demand (not by `up`), e.g.
  #   docker compose --profile jobs run --rm worker python -m retro_cable.ingest scan --tv /sources/tv
  #   docker compose --profile jobs run --rm worker python -m retro_cable.ingest normalize
  # Sources are read-only; the media root is the only place it writes besides /data.
  worker:
    image: ghcr.io/btabaska/retro-cable-api:${RC_VERSION:-edge}
    profiles: ["jobs"]
    env_file:
      - path: .env
        required: false
    environment:
      RC_DATA_DIR: /data
      RC_CATALOG_DIR: /catalog
      RC_MEDIA_DIR: /media
    volumes:
      - ${RC_DATA_DIR:-./data}:/data
      - ${RC_CATALOG_SRC:-../catalog}:/catalog:ro
      - ${RC_MEDIA_DIR:-./media}:/media:rw
      - ${RC_SOURCE_DIR:-./sources}:/sources:ro

  # Records the rig's encodes in the database: reads manifest.json at the media root
  # (written by the rig worker, ops/rig/) whenever it changes, so new files go on the air
  # without a redeploy. It never probes or writes media. On when ops/.env has
  # COMPOSE_PROFILES=media-index (the mini), off everywhere else.
  media-index:
    image: ghcr.io/btabaska/retro-cable-api:${RC_VERSION:-edge}
    profiles: ["media-index"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "retro_cable.ingest", "index-media", "--watch", "${RC_INDEX_EVERY:-300}"]
    env_file:
      - path: .env
        required: false
    environment:
      RC_DATA_DIR: /data
      RC_CATALOG_DIR: /catalog
      RC_MEDIA_DIR: /media
    volumes:
      - ${RC_DATA_DIR:-./data}:/data
      - ${RC_MEDIA_DIR:-./media}:/media:ro,rslave
